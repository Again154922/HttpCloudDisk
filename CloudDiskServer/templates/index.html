<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Disk · 云盘</title>
    <style>
        :root {
            --primary: #4f8cff;
            --primary-2: #7b5cff;
            --accent: #35d0ba;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, .72);
            --text-faint: rgba(255, 255, 255, .48);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background:
                radial-gradient(1200px 800px at 15% 10%, rgba(79, 140, 255, .28), transparent 60%),
                radial-gradient(1000px 700px at 85% 85%, rgba(123, 92, 255, .30), transparent 60%),
                linear-gradient(135deg, #0b1026 0%, #101a3c 55%, #0d0f24 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 背景装饰光斑 */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .45;
            z-index: 0;
            pointer-events: none;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            left: -120px;
            top: -100px;
            background: radial-gradient(circle, rgba(53, 208, 186, .55), transparent 70%);
            animation: drift 22s ease-in-out infinite alternate;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            right: -160px;
            bottom: -140px;
            background: radial-gradient(circle, rgba(123, 92, 255, .60), transparent 70%);
            animation: drift 26s ease-in-out infinite alternate-reverse;
        }

        .blob-3 {
            width: 260px;
            height: 260px;
            left: 55%;
            top: -80px;
            background: radial-gradient(circle, rgba(79, 140, 255, .50), transparent 70%);
            animation: drift 30s ease-in-out infinite alternate;
        }

        /* 悬浮的小星星 */
        .star {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .8);
            box-shadow: 0 0 8px 1px rgba(255, 255, 255, .55);
            animation: twinkle 3s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes drift {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }
            to {
                transform: translate3d(40px, 30px, 0) scale(1.12);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: .15;
                transform: scale(.7);
            }
            50% {
                opacity: .9;
                transform: scale(1.15);
            }
        }

        /* 主卡片 */
        .card {
            position: relative;
            z-index: 1;
            width: min(560px, calc(100% - 40px));
            padding: 56px 56px 44px;
            text-align: center;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: card-in .9s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(28px) scale(.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 云朵图标 */
        .logo {
            width: 86px;
            height: 86px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79, 140, 255, .30), rgba(53, 208, 186, .24));
            border: 1px solid rgba(255, 255, 255, .20);
            box-shadow: 0 12px 32px rgba(79, 140, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
            animation: logo-float 5s ease-in-out infinite;
        }

        .logo svg {
            width: 48px;
            height: 48px;
        }

        @keyframes logo-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-7px);
            }
        }

        .greeting {
            font-size: 15px;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(120deg, #ffffff 20%, #9cc3ff 55%, #b8a6ff 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .clock {
            font-size: 21px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            color: var(--text);
            opacity: .92;
        }

        .desc {
            margin: 22px 0 34px;
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        .desc .sep {
            margin: 0 8px;
            color: var(--text-faint);
        }

        /* 进入按钮 */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 42px;
            border-radius: 999px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            box-shadow: 0 12px 32px rgba(79, 140, 255, .38);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -80%;
            width: 55%;
            height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .35), transparent);
            transform: skewX(-20deg);
            transition: left .55s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 18px 42px rgba(79, 140, 255, .50);
        }

        .btn:hover::before {
            left: 130%;
        }

        .btn:active {
            transform: translateY(-1px) scale(.98);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            transition: transform .25s ease;
        }

        .btn:hover svg {
            transform: translateX(4px);
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--text-faint);
        }

        @media (max-width: 480px) {
            .card {
                padding: 42px 24px 34px;
                border-radius: 22px;
            }

            h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }

            .clock {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <main class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" color="#fff">
                <path d="M17.5 19a4.5 4.5 0 0 0 .42-8.98 6 6 0 0 0-11.7 1.6A4 4 0 0 0 6.5 19h11z"/>
                <path d="M12 19v-5" />
                <path d="M9.5 11.5 12 9l2.5 2.5" />
            </svg>
        </div>
        <p class="greeting" id="greeting">欢迎回来</p>
        <h1>云端存储</h1>
        <p class="clock" id="clock">--:--:--</p>
        <p class="desc">安全 · 快速 · 随时随地访问你的文件<span class="sep">|</span>支持文件浏览与下载</p>
        <a class="btn" href="/browse?dir=D:">
            进入云盘
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14" />
                <path d="m13 6 6 6-6 6" />
            </svg>
        </a>
        <p class="footer">当前入口：D 盘</p>
    </main>

    <script>
        // 生成漂浮的小星星
        (function makeStars() {
            var count = 36;
            var container = document.body;
            for (var i = 0; i < count; i++) {
                var star = document.createElement("span");
                star.className = "star";
                var size = 2 + Math.random() * 3;
                star.style.width = size + "px";
                star.style.height = size + "px";
                star.style.left = Math.random() * 100 + "%";
                star.style.top = Math.random() * 100 + "%";
                star.style.animationDelay = Math.random() * 4 + "s";
                star.style.animationDuration = (2.5 + Math.random() * 3) + "s";
                container.appendChild(star);
            }
        })();

        // 问候语 + 实时时钟
        var greetingEl = document.getElementById("greeting");
        var clockEl = document.getElementById("clock");

        function tick() {
            var now = new Date();
            var hour = now.getHours();

            var greeting = "晚上好";
            if (hour < 6) {
                greeting = "夜深了";
            } else if (hour < 9) {
                greeting = "早上好";
            } else if (hour < 12) {
                greeting = "上午好";
            } else if (hour < 14) {
                greeting = "中午好";
            } else if (hour < 18) {
                greeting = "下午好";
            } else if (hour < 22) {
                greeting = "晚上好";
            }

            greetingEl.textContent = greeting + "，欢迎回来";
            clockEl.textContent =
                now.toLocaleTimeString("zh-CN", { hour12: false }) +
                " · " +
                now.toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
        }

        tick();
        setInterval(tick, 1000);
    </script>
</body>
</html>
